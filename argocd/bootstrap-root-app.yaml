apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gridops-root-app
  namespace: argocd
spec:
  project: default
  source:
    # This is the repo where Django is pushing files
    repoURL: https://github.com/JimohAdebayo-DevOps/gridops-cluster-state.git
    targetRevision: HEAD
    path: apps  # <--- Argo will look inside this folder
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
