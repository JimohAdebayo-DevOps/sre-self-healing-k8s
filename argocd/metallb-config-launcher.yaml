apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-network-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/JimohAdebayo-DevOps/sre-self-healing-k8s.git'
    targetRevision: main
    path: k8s/metallb 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true 
      selfHeal: true
    syncOptions:
      - ServerSideApply=true 
