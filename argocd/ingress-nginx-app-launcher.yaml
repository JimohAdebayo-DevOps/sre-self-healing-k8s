apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  # ARCHITECTURAL SHIFT: Implement the Dual-Source Pattern
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.11.2
      helm:
        valueFiles:
          - $values/k8s/ingress-nginx/values.yaml
          
    - repoURL: https://github.com/JimohAdebayo-DevOps/sre-self-healing-k8s.git
      targetRevision: main
      ref: values
      
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: false 
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
