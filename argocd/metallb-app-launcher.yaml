apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-system
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    # SOURCE 1: The Official MetalLB Helm Chart (Schema-Perfect)
    - chart: metallb
      repoURL: https://metallb.github.io/metallb
      targetRevision: 0.14.5
      
    # SOURCE 2: Your Sovereign Network Configuration
    - repoURL: 'https://github.com/JimohAdebayo-DevOps/sre-self-healing-k8s.git'
      targetRevision: main
      path: k8s/metallb 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: false 
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
