apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-admin-secret
  namespace: keycloak
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-admin-secret # This matches the 'existingSecret' in your values.yaml
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: keycloak-admin-secret # The secret path in HashiCorp Vault
        property: admin-password

---
# 2. Dynamically inject the PostgreSQL Database Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-db-secret
  namespace: keycloak
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-db-secret # This matches the 'existingSecret' in your values.yaml
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: keycloak-db-secret # The secret path in HashiCorp Vault
        property: password
    - secretKey: username
      remoteRef:
        key: keycloak-db-secret
        property: username
