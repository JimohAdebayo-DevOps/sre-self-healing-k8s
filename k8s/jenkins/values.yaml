controller:
  image:
    tag: "2.492.1-lts-jdk21"
  
  javaOpts: "-Xms1024m -Xmx1024m -Djava.awt.headless=true"
  
  securityContext:
    runAsUser: 1000
    fsGroup: 1000
    
  admin:
    existingSecret: "jenkins-admin-credentials"
    userKey: "jenkins-admin-user"
    passwordkey: "jenkins-admin-password"
    
  installPlugins:
    - workflow-aggregator
    - git
    - github-branch-source
    - job-dsl
    - kubernetes
    - credentials-binding
    - keycloak
    - role-strategy
    - configuration-as-code

  # ==============================================================
  # THE GITOPS SRE UPGRADE: Probe Assassination Immunity
  # ==============================================================
  probes:
    startupProbe:
      failureThreshold: 60
      periodSeconds: 10

  # Resource Management
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

  # Networking (Ingress)
  ingress:
    enabled: true
    ingressClassName: nginx
    hostName: jenkins.sikiru.co.uk
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
      # Using native annotations since snippets are disabled
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
      nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"

      # ==============================================================
      # THE GITOPS SRE UPGRADE: Buffer Expansion & Mixed Content Fix
      # ==============================================================
      # 1. Expand Nginx memory buffers to accept massive Keycloak OIDC JWTs
      # (Matches the proven Keycloak SSO baseline)
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
      nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "256k"
      nginx.ingress.kubernetes.io/large-client-header-buffers: "4 128k"
      
      # 2. Force Jenkins to load CSS/JS assets over HTTPS to fix the blinking arrow
      nginx.ingress.kubernetes.io/configuration-snippet: |
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

    tls:
      - secretName: jenkins-tls-cert
        hosts:
          - jenkins.sikiru.co.uk

  # Storage (Longhorn)
  persistence:
    enabled: true
    storageClass: longhorn
    size: "10Gi"
  # 1. Inject the Vault-backed secret into Jenkins' active memory
  containerEnv:
    - name: GITHUB_USER
      valueFrom:
        secretKeyRef:
          name: jenkins-github-creds
          key: username
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: jenkins-github-creds
          key: token
    # ==============================================================
    # THE GITOPS SRE UPGRADE: Vault-Backed Keycloak Secret Injection
    # ==============================================================
    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          # Match the 'target.name' in external-secret.yaml
          name: jenkins-keycloak-secret
          key: client-secret

  # 2. Jenkins Configuration as Code (JCasC)
  JCasC:
    defaultConfig: true
    configScripts:
      welcome-message: |
        jenkins:
          systemMessage: "Welcome to Sikiru-Lab Jenkins CI/CD. Authenticated via Keycloak."
      
      # 3. Forge the Credentials mathematically
      credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: "github-pat"  # This perfectly matches Jenkinsfile!
                      username: "${GITHUB_USER}"
                      password: "${GITHUB_TOKEN}"
                      description: "GitHub PAT for GitOps Write-Back Loop"
      # ==============================================================
      # THE GITOPS SRE UPGRADE: Zero Trust Security Realm (Keycloak SSO)
      # ==============================================================
      security: |
        jenkins:
          securityRealm:
            keycloak:
              keycloakJson: |
                {
                  "realm": "Sikiru-Lab",
                  "auth-server-url": "https://sso.sikiru.co.uk/",
                  "ssl-required": "external",
                  "resource": "jenkins",
                  "public-client": false,
                  "credentials": {
                    "secret": "${OIDC_CLIENT_SECRET}"
                  },
                  "confidential-port": 0
                }
          authorizationStrategy:
            roleBased:
              roles:
                global:
                  - name: "admin"
                    description: "GridOps Platform Administrators"
                    permissions:
                      - "Overall/Administer"
                    # THE CRITICAL FIX: The modern schema uses typed 'entries'
                    entries:
                      - group: "jenkins-admins"
                  - name: "developer"
                    description: "GridOps Developers"
                    permissions:
                      - "Overall/Read"
                      - "Job/Build"
                      - "Job/Read"
                      - "Job/Workspace"
                    entries:
                      - group: "GridEngineers"

      # 4. Automate the GitHub Organization Setup
      jobs: |
        jobs:
          - script: >
              organizationFolder('GridOps-Platform') {
                  description("Automated CI/CD for GridOps Developer Platform")
                  displayName("GridOps Sovereign Pipeline")
                  organizations {
                      github {
                          repoOwner("JimohAdebayo-DevOps")
                          credentialsId("github-pat")
                          traits {
                              // Discover all repositories
                              sourceWildcardFilter {
                                  includes('*')
                                  excludes('')
                              }
                              // Discover branches with a Jenkinsfile
                              gitHubBranchDiscovery {
                                  strategyId(1) 
                              }
                          }
                      }
                  }
                  orphanedItemStrategy {
                      discardOldItems {
                          numToKeep(10)
                      }
                  }
              }

# Service Account for Ephemeral Agents
serviceAccount:
  create: true
  name: jenkins
