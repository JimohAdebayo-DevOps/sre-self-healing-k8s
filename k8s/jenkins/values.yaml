controller:
  image:
    tag: "2.492.1-lts-jdk21"
  securityContext:
    runAsUser: 1000
    fsGroup: 1000
  admin:
    existingSecret: "jenkins-admin-credentials"
    userKey: "jenkins-admin-user"
    passwordkey: "jenkins-admin-password"
  # ==============================================================
  # THE GITOPS SRE UPGRADE: Dynamic Plugin Resolution
  # ==============================================================
  installPlugins:
    # 1. Pipeline & GitOps Core
    - workflow-aggregator
    - git
    - github-branch-source
    
    # 2. Ephemeral Architecture
    - kubernetes
    
    # 3. Security & Zero Trust Boundaries
    - credentials-binding
    - keycloak
    - role-strategy
    
    # 4. GitOps State Convergence
    - configuration-as-code
# Resource Management
  resources:
    requests:
      cpu: "100m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

  # Networking (Ingress)
  ingress:
    enabled: true
    ingressClassName: nginx
    hostName: jenkins.sikiru.co.uk
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
      # Using native annotations since snippets are disabled
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
      nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    tls:
      - secretName: jenkins-tls-cert
        hosts:
          - jenkins.sikiru.co.uk

  # Storage (Longhorn)
  persistence:
    enabled: true
    storageClass: longhorn
    size: "10Gi"
  # 1. Inject the Vault-backed secret into Jenkins' active memory
  containerEnv:
    - name: GITHUB_USER
      valueFrom:
        secretKeyRef:
          name: jenkins-github-creds
          key: username
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: jenkins-github-creds
          key: token

  # 2. Jenkins Configuration as Code (JCasC)
  JCasC:
    defaultConfig: true
    configScripts:
      welcome-message: |
        jenkins:
          systemMessage: "Welcome to Sikiru-Lab Jenkins CI/CD. Authenticated via Keycloak."
      
      # 3. Forge the Credentials mathematically
      credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: "github-pat"  # This perfectly matches Jenkinsfile!
                      username: "${GITHUB_USER}"
                      password: "${GITHUB_TOKEN}"
                      description: "GitHub PAT for GitOps Write-Back Loop"
      # ==============================================================
      # THE GITOPS SRE UPGRADE: Zero Trust Security Realm (Keycloak SSO)
      # ==============================================================
      security: |
        jenkins:
          securityRealm:
            keycloak:
              keycloakJson: |
                {
                  "realm": "Sikiru-Lab",
                  "auth-server-url": "https://sso.sikiru.co.uk/",
                  "ssl-required": "external",
                  "resource": "jenkins",
                  "public-client": true,
                  "confidential-port": 0
                }
          authorizationStrategy:
            roleBased:
              roles:
                global:
                  - name: "admin"
                    description: "GridOps Platform Administrators"
                    permissions:
                      - "Overall/Administer"
                    assignments:
                      - "jenkins-admins" # This must mathematically match your Keycloak Group name
                  - name: "developer"
                    description: "GridOps Developers"
                    permissions:
                      - "Overall/Read"
                      - "Job/Build"
                      - "Job/Read"
                      - "Job/Workspace"
                    assignments:
                      - "GridEngineers" # Matches your existing Keycloak group

      # 4. Automate the GitHub Organization Setup
      jobs: |
        jobs:
          - script: >
              organizationFolder('GridOps-Platform') {
                  description("Automated CI/CD for GridOps Developer Platform")
                  displayName("GridOps Sovereign Pipeline")
                  organizations {
                      github {
                          repoOwner("JimohAdebayo-DevOps")
                          credentialsId("github-pat")
                          traits {
                              // Discover all repositories
                              sourceWildcardFilter {
                                  includes('*')
                                  excludes('')
                              }
                              // Discover branches with a Jenkinsfile
                              gitHubBranchDiscovery {
                                  strategyId(1) 
                              }
                          }
                      }
                  }
                  orphanedItemStrategy {
                      discardOldItems {
                          numToKeep(10)
                      }
                  }
              }

# Service Account for Ephemeral Agents
serviceAccount:
  create: true
  name: jenkins
