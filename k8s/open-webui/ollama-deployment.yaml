apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        env:
        # SRE FIX: Explicitly direct Ollama to store models on the mounted PVC path
        - name: OLLAMA_MODELS
          value: "/home/ollama/.ollama/models"
        resources:
          requests:
            cpu: "250m"
            memory: "4Gi"
          limits:
            cpu: "2000m"
            memory: "12Gi"
        volumeMounts:
        - name: model-storage
          mountPath: /home/ollama/.ollama
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: ollama-models-pvc
