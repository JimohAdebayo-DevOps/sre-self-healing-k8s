apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        env:
        # Direct UI requests to internal Ollama service endpoint
        - name: OLLAMA_BASE_URL
          value: "http://ollama-service.open-webui.svc.cluster.local:11434"
        
        # OIDC Configurations (Keycloak Handshake) [17]
        - name: ENABLE_OAUTH_SIGNUP
          value: "true"
        - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
          value: "true"
        - name: OAUTH_PROVIDER_NAME
          value: "Sikiru-Lab SSO"
        - name: OPENID_PROVIDER_URL
          value: "https://sso.sikiru.co.uk/realms/Sikiru-Lab/.well-known/openid-configuration"
        - name: OAUTH_CLIENT_ID
          value: "open-webui"
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: open-webui-secrets
              key: keycloak-client-secret
        - name: OAUTH_REDIRECT_URI
          value: "https://chat.sikiru.co.uk/oauth/oidc/callback"
        - name: OAUTH_SCOPES
          value: "openid profile email"
        volumeMounts:
        - name: webui-storage
          mountPath: /app/backend/data
      volumes:
      - name: webui-storage
        persistentVolumeClaim:
          claimName: open-webui-data-pvc
