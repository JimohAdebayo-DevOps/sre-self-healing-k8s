kubeProxyReplacement: strict

# ARCHITECTURAL FIX: Explicitly define the physical API server 
k8sServiceHost: "192.168.0.150"
k8sServicePort: "6443"

encryption:
  enabled: true
  type: wireguard
  wireguard:
    persistentKeepalive: 25

clusterMesh:
  enabled: true
  apiserver:
    service:
      type: LoadBalancer 

routingMode: native
bpf:
  masquerade: true

ipam:
  mode: "cluster-pool"
  operator:
    clusterPoolIPv4PodCIDRList: ["172.16.0.0/16"]
    clusterPoolIPv4MaskSize: 24
